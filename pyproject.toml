[project]
name = "assay"
version = "0.1.0"
description = "Cleans messy shipment CSVs into DuckDB and answers business questions in natural language."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "typer>=0.15",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "openai>=1.57",
    "pyyaml>=6.0",
    "streamlit>=1.40",
]

[project.scripts]
assay = "assay.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not live'"
markers = [
    "live: hits real LLM APIs; deselected by default (run with -m live)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
packages = ["assay"]
strict = true
